# amr_aruco 패키지 노드 파라미터 기본값.
#
# 교체 실행:
#   ros2 launch amr_aruco amr_aruco.launch.py params_file:=/path/to/my_params.yaml
# 개별 오버라이드(단독 실행 시):
#   ros2 run amr_aruco aruco_detect --ros-args -p aruco_dict:=DICT_5X5_100
#
# 토픽 이름과 QoS 는 fleet_fsm/상대 노드와의 "프로토콜"이라 파라미터가 아닌
# 코드 상수(amr_aruco/common.py)로 관리한다. 바꿔야 하면 리맵핑(-r)을 쓸 것.

# amr_patrol_emer_helmet 노드 (TurtleBot4Navigator 기반이라 노드 이름은 basic_navigator)
/**/basic_navigator:
  ros__parameters:
    # 배터리 잔량(0.0~1.0)이 이 값 미만이면 순찰을 중단하고 도킹 복귀.
    # fleet_fsm 도 같은 battery_state 를 보고 로봇을 선정하므로, fleet_fsm 의
    # 선정 기준보다 높게 잡으면 순찰을 받자마자 복귀하는 일이 생길 수 있다.
    battery_low_threshold: 0.1

    # 도킹 스테이션 좌표 [x, y] (map 기준). 초기 pose 설정과 순찰 마지막
    # 복귀 지점 방향 계산에 쓰인다.
    dock_position: [0.0, 0.0]

    # dock() 전에 먼저 이동해 둘 여유 지점 [x, y]. dock_position 은 코스트맵상
    # 도킹 스테이션 본체와 겹쳐 있어 곧장 goToPose 하면 경로 계획이 실패할 수
    # 있고, 마지막 정밀 접속은 IR 센서 기반의 dock() 에 맡겨야 하기 때문이다.
    dock_approach_position: [-0.5, 0.0]

    # 도킹 방향 (TurtleBot4Directions 의 도 단위 값):
    # NORTH=0, NORTH_WEST=45, WEST=90, SOUTH_WEST=135,
    # SOUTH=180, SOUTH_EAST=225, EAST=270, NORTH_EAST=315
    dock_direction: 0

    # 순찰이 끝나고 도킹/idle 상태가 된 뒤, 안전모 배달을 실제로 시작하기까지
    # 기다리는 시간(초). 막 도킹 완료한 로봇이 곧바로 재출동하지 않도록 하는
    # 유예 시간으로, 필요에 맞게 조정한다.
    helmet_idle_delay: 3.0

    # 안전모 배달 지점 도착 후 현장 대기 시간(초).
    helmet_delivery_hold: 5.0

    # 소화기 포인트 도착(goToPose 완료 판정) 직후, 아루코 인식을 신뢰하기 전에
    # 로봇이 완전히 멈출 때까지 기다리는 시간(초). goToPose 는 목표 허용오차
    # 안에 들어오면 완료로 보고하므로 실제로는 아직 미세하게 관성으로 움직이는
    # 중일 수 있고, 이때 잡힌 프레임(모션 블러) 기반의 aruco_check_done=True 는
    # 신뢰할 수 없다. 이 구간 동안 들어오는 신호는 무시하고, 구간이 끝난 뒤부터
    # 새로 들어오는 신호만 유효한 대조 완료로 인정한다.
    aruco_settle_time: 3.0

    # 소화기 포인트에서 아루코 대조 완료(aruco_check_done) 신호를 기다리는
    # 최대 시간(초). aruco_detect 가 마커를 못 찾는 등의 이유로 신호가 영영
    # 오지 않으면 순찰 전체가 멈춰버리므로, 이 시간이 지나면 대조 실패로 보고
    # 그냥 다음 지점으로 이동한다.
    aruco_check_timeout: 5.0

    # 순찰 웨이포인트 json 파일 경로. 빈 문자열이면 패키지에 포함된
    # patrol_points.json 을 사용한다 (symlink-install 환경에서는 소스의 json 을
    # 재빌드 없이 직접 수정 가능). "yaw" 필드가 있는 지점은 소화기 포인트로
    # 간주되어 도착 후 아루코 대조 완료 신호를 기다린다.
    patrol_points_file: ""

# aruco_detect 노드
/**/aruco_marker_detector:
  ros__parameters:
    # 사용할 아루코 딕셔너리 이름 (cv2.aruco 의 상수명 그대로).
    # 예: DICT_4X4_50, DICT_5X5_100, DICT_6X6_250 등.
    # 순찰 현장에 부착된 실제 마커의 딕셔너리와 일치해야 한다.
    aruco_dict: "DICT_4X4_50"

    # 검출 결과를 OpenCV 창(imshow)으로 표시할지 여부. 디스플레이가 없는
    # 환경(ssh/headless)에서는 false 로 둘 것. false 여도 디버그 영상 토픽
    # (aruco/detection/compressed)은 계속 발행된다.
    show_window: true
